<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Kaizen Code</title>
    <style>
        /* Base Reset & Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        /* Header Layout */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            color: #007bff;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            color: #666;
            font-size: 1.1rem;
        }

        /* Two-column layout grid using native CSS Grid */
        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }
        @media screen and (min-width: 1280px) {
        }body {
    font-size: 18px;
    padding: 20px;
  }
  
       
       @media screen and (min-width:360px) {
      .main-content {
        float: right;
        width: 65%;
    }
       }

        /* Form Styling */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #444;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
            transition: 
            border-color 0.3s ease;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #007bff;
            outline: none;
        }

        .submit-btn {
            background-color: #007bff;
            color: #fff;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        .submit-btn:hover {
            background-color: #0056b3;
        }

        /* Map and Details Block */
        .details-panel {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .company-info {
            margin-bottom: 25px;
        }

        .company-info h3 {
            margin-bottom: 10px;
            color: #333;
        }

        /* Responsive Iframe Map Wrap */
        .map-container {
            position: relative;
            width: 100%;
            height: 320px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Kaizen Code</h1>
            <p>Get in touch with us. We would love to hear from you!</p>
        </header>

        <div class="contact-wrapper">
            <!-- Left Side: Form Container -->
            <section class="form-container">
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="example@kaizencode.com" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Your Message</label>
                        <textarea id="message" name="message" rows="6" placeholder="How can we help you?" required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
            </section>

            <!-- Right Side: Details and Map -->
            <section class="details-panel">
                <div class="company-info">
                    <h3>Contact Information</h3>
                    <p><strong>Address:</strong> Anasagar Link Road Ajmer</p>
                    <p><strong>Email:</strong> contact@kaizencode.com</p>
                    <p><strong>Hours:</strong> Mon - Fri, 10:30 AM - 11:30 PM</p>
                </div>
                <!-- Google Maps Embed Iframe -->
                <div class="map-container">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14285.453428737728!2d74.61528629064557!3d26.476243180572034!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x396be7005fa90773%3A0xbfffd2b80c7b5c8d!2sKaizen%20Coffee%20House!5e0!3m2!1sen!2sin!4v1792821450489!5m2!1sen!2sin" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>">
                    </iframe>
                </div>
            </section>
        </div>
    </div>

</body>
</html>
